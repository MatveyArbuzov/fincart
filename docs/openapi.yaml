openapi: 3.0.3

info:
  title: FinCart API
  description: E-commerce backend API
  version: 1.0.0

servers:
  - url: http://localhost:8080/api/v1
    description: Local development server

tags:
  - name: Auth
    description: Authentication and authorization
  - name: Products
    description: Public product operations
  - name: Cart
    description: Shopping cart operations
  - name: Orders
    description: Customer order operations
  - name: Admin
    description: Administrator operations

paths:

  # ============================================================
  # AUTH
  # ============================================================

  /auth/register:
    post:
      tags:
        - Auth
      summary: Register a new user
      operationId: register
      security: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'

      responses:
        '201':
          description: User successfully registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

        '400':
          $ref: '#/components/responses/BadRequest'

        '500':
          $ref: '#/components/responses/InternalServerError'


  /auth/login:
    post:
      tags:
        - Auth
      summary: Login user
      operationId: login
      security: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'

      responses:
        '200':
          description: Successful login
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'

        '400':
          $ref: '#/components/responses/BadRequest'

        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '500':
          $ref: '#/components/responses/InternalServerError'


  /auth/refresh:
    post:
      tags:
        - Auth
      summary: Refresh access token
      operationId: refreshToken
      security: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'

      responses:
        '200':
          description: Tokens successfully refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResponse'

        '400':
          $ref: '#/components/responses/BadRequest'

        '401':
          description: Invalid refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '500':
          $ref: '#/components/responses/InternalServerError'


  /auth/logout:
    post:
      tags:
        - Auth
      summary: Logout user
      operationId: logout
      security: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'

      responses:
        '204':
          description: Successfully logged out

        '400':
          $ref: '#/components/responses/BadRequest'

        '401':
          description: Invalid refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '500':
          $ref: '#/components/responses/InternalServerError'


  # ============================================================
  # PRODUCTS
  # ============================================================

  /products:
    get:
      tags:
        - Products
      summary: Get all products
      operationId: getProducts
      security: []

      responses:
        '200':
          description: List of products
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Product'

        '500':
          $ref: '#/components/responses/InternalServerError'


  /products/{id}:
    get:
      tags:
        - Products
      summary: Get product by ID
      operationId: getProductByID
      security: []

      parameters:
        - $ref: '#/components/parameters/ProductID'

      responses:
        '200':
          description: Product
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'

        '400':
          description: Invalid product ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '404':
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '500':
          $ref: '#/components/responses/InternalServerError'


  # ============================================================
  # ADMIN PRODUCTS
  # ============================================================

  /admin/products:
    post:
      tags:
        - Admin
      summary: Create product
      operationId: createProduct

      security:
        - BearerAuth: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductRequest'

      responses:
        '201':
          description: Product successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'

        '400':
          description: Invalid product
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '401':
          $ref: '#/components/responses/Unauthorized'

        '403':
          $ref: '#/components/responses/Forbidden'

        '500':
          $ref: '#/components/responses/InternalServerError'


  /admin/products/{id}:
    patch:
      tags:
        - Admin
      summary: Update product
      operationId: updateProduct

      security:
        - BearerAuth: []

      parameters:
        - $ref: '#/components/parameters/ProductID'

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProductRequest'

      responses:
        '200':
          description: Product successfully updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'

        '400':
          description: Invalid product
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '401':
          $ref: '#/components/responses/Unauthorized'

        '403':
          $ref: '#/components/responses/Forbidden'

        '404':
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      tags:
        - Admin
      summary: Delete product
      operationId: deleteProduct

      security:
        - BearerAuth: []

      parameters:
        - $ref: '#/components/parameters/ProductID'

      responses:
        '204':
          description: Product successfully deleted

        '400':
          description: Invalid product ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '401':
          $ref: '#/components/responses/Unauthorized'

        '403':
          $ref: '#/components/responses/Forbidden'

        '404':
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '500':
          $ref: '#/components/responses/InternalServerError'


  # ============================================================
  # CART
  # ============================================================

  /cart:
    get:
      tags:
        - Cart
      summary: Get current user's cart
      operationId: getCart

      security:
        - BearerAuth: []

      responses:
        '200':
          description: Current shopping cart
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'

        '401':
          $ref: '#/components/responses/Unauthorized'

        '404':
          description: Cart not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '500':
          $ref: '#/components/responses/InternalServerError'


  /cart/items:
    post:
      tags:
        - Cart
      summary: Add product to cart
      operationId: addCartItem

      security:
        - BearerAuth: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddItemRequest'

      responses:
        '200':
          description: Updated cart
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'

        '400':
          description: Invalid cart request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '401':
          $ref: '#/components/responses/Unauthorized'

        '404':
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '409':
          description: Insufficient stock
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '500':
          $ref: '#/components/responses/InternalServerError'


  /cart/items/{product_id}:
    patch:
      tags:
        - Cart
      summary: Update cart item quantity
      operationId: updateCartItem

      security:
        - BearerAuth: []

      parameters:
        - $ref: '#/components/parameters/CartProductID'

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateItemRequest'

      responses:
        '200':
          description: Updated cart
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'

        '400':
          description: Invalid cart request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '401':
          $ref: '#/components/responses/Unauthorized'

        '404':
          description: Product or cart item not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '409':
          description: Insufficient stock
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      tags:
        - Cart
      summary: Remove product from cart
      operationId: deleteCartItem

      security:
        - BearerAuth: []

      parameters:
        - $ref: '#/components/parameters/CartProductID'

      responses:
        '200':
          description: Updated cart
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'

        '400':
          description: Invalid product ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '401':
          $ref: '#/components/responses/Unauthorized'

        '404':
          description: Cart or cart item not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '500':
          $ref: '#/components/responses/InternalServerError'


  /cart/checkout:
    post:
      tags:
        - Cart
      summary: Checkout current cart
      operationId: checkoutCart

      security:
        - BearerAuth: []

      responses:
        '201':
          description: Order successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'

        '401':
          $ref: '#/components/responses/Unauthorized'

        '404':
          description: Cart or product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '409':
          description: Checkout conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '500':
          $ref: '#/components/responses/InternalServerError'


  # ============================================================
  # ORDERS
  # ============================================================

  /orders:
    post:
      tags:
        - Orders
      summary: Create order
      operationId: createOrder

      security:
        - BearerAuth: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'

      responses:
        '201':
          description: Order successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'

        '400':
          description: Invalid order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '401':
          $ref: '#/components/responses/Unauthorized'

        '404':
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '409':
          description: Order conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '500':
          $ref: '#/components/responses/InternalServerError'


  /orders/{id}:
    get:
      tags:
        - Orders
      summary: Get order by ID
      operationId: getOrder

      security:
        - BearerAuth: []

      parameters:
        - $ref: '#/components/parameters/OrderID'

      responses:
        '200':
          description: Order with items
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetails'

        '400':
          description: Invalid order ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '401':
          $ref: '#/components/responses/Unauthorized'

        '403':
          description: User is not allowed to access this order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '404':
          description: Order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '500':
          $ref: '#/components/responses/InternalServerError'


  /orders/{id}/cancel:
    post:
      tags:
        - Orders
      summary: Cancel order
      operationId: cancelOrder

      security:
        - BearerAuth: []

      parameters:
        - $ref: '#/components/parameters/OrderID'

      responses:
        '204':
          description: Order successfully cancelled

        '400':
          description: Invalid order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '401':
          $ref: '#/components/responses/Unauthorized'

        '403':
          description: User is not allowed to cancel this order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '404':
          description: Order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '409':
          description: Invalid order state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '500':
          $ref: '#/components/responses/InternalServerError'


  /orders/{id}/pay:
    post:
      tags:
        - Orders
      summary: Pay order
      operationId: payOrder

      security:
        - BearerAuth: []

      parameters:
        - $ref: '#/components/parameters/OrderID'

      responses:
        '204':
          description: Order successfully paid

        '400':
          description: Invalid order ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '401':
          $ref: '#/components/responses/Unauthorized'

        '403':
          description: User is not allowed to pay this order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '404':
          description: Order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '402':
          description: Payment failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '409':
          description: Invalid order state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '504':
          description: Payment timeout
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '500':
          $ref: '#/components/responses/InternalServerError'


  # ============================================================
  # ADMIN ORDERS
  # ============================================================

  /admin/orders:
    get:
      tags:
        - Admin
      summary: Get all orders
      operationId: listOrders

      security:
        - BearerAuth: []

      responses:
        '200':
          description: List of orders
          content:
            application/json:
              schema:
                type: object
                required:
                  - orders
                properties:
                  orders:
                    type: array
                    items:
                      $ref: '#/components/schemas/Order'

        '401':
          $ref: '#/components/responses/Unauthorized'

        '403':
          $ref: '#/components/responses/Forbidden'

        '500':
          $ref: '#/components/responses/InternalServerError'


  /admin/orders/{id}/status:
    patch:
      tags:
        - Admin
      summary: Update order status
      operationId: updateOrderStatus

      security:
        - BearerAuth: []

      parameters:
        - $ref: '#/components/parameters/OrderID'

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrderStatusRequest'

      responses:
        '204':
          description: Order status successfully updated

        '400':
          description: Invalid order or request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '401':
          $ref: '#/components/responses/Unauthorized'

        '403':
          $ref: '#/components/responses/Forbidden'

        '404':
          description: Order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '409':
          description: Invalid order state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '500':
          $ref: '#/components/responses/InternalServerError'


components:

  # ============================================================
  # SECURITY
  # ============================================================

  securitySchemes:

    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT


  # ============================================================
  # PARAMETERS
  # ============================================================

  parameters:

    ProductID:
      name: id
      in: path
      required: true
      description: Product ID
      schema:
        type: integer
        format: int64
        minimum: 1

    OrderID:
      name: id
      in: path
      required: true
      description: Order ID
      schema:
        type: integer
        format: int64
        minimum: 1
    
    CartProductID:
      name: product_id
      in: path
      required: true
      description: Product ID in cart
      schema:
        type: integer
        format: int64
        minimum: 1


  # ============================================================
  # RESPONSES
  # ============================================================

  responses:

    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'


  # ============================================================
  # SCHEMAS
  # ============================================================

  schemas:

    # -------------------------
    # Common
    # -------------------------

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          example: invalid_request_body


    # -------------------------
    # Auth
    # -------------------------

    RegisterRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: user@example.com

        password:
          type: string
          format: password
          minLength: 1
          example: secret123


    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: user@example.com

        password:
          type: string
          format: password
          minLength: 1
          example: secret123


    RefreshRequest:
      type: object
      required:
        - refresh_token
      properties:
        refresh_token:
          type: string
          example: eyJhbGciOiJIUzI1NiIs...


    LogoutRequest:
      type: object
      required:
        - refresh_token
      properties:
        refresh_token:
          type: string
          example: eyJhbGciOiJIUzI1NiIs...


    User:
      type: object
      required:
        - id
        - email
        - role
        - created_at
      properties:
        id:
          type: integer
          format: int64
          example: 1

        email:
          type: string
          format: email
          example: user@example.com

        role:
          type: string
          enum:
            - user
            - admin
          example: user

        created_at:
          type: string
          format: date-time
          example: "2026-08-23T10:00:00Z"


    LoginResponse:
      type: object
      required:
        - user
        - access_token
        - refresh_token
      properties:
        user:
          $ref: '#/components/schemas/User'

        access_token:
          type: string
          example: eyJhbGciOiJIUzI1NiIs...

        refresh_token:
          type: string
          example: eyJhbGciOiJIUzI1NiIs...


    RefreshResponse:
      type: object
      required:
        - access_token
        - refresh_token
      properties:
        access_token:
          type: string
          example: eyJhbGciOiJIUzI1NiIs...

        refresh_token:
          type: string
          example: eyJhbGciOiJIUzI1NiIs...


    # -------------------------
    # Products
    # -------------------------

    Product:
      type: object
      required:
        - id
        - name
        - description
        - price
        - currency
        - stock
      properties:
        id:
          type: integer
          format: int64
          example: 1

        name:
          type: string
          example: MacBook Pro

        description:
          type: string
          example: Apple laptop

        price:
          type: integer
          format: int64
          minimum: 0
          description: Price in the smallest currency unit
          example: 150000

        currency:
          type: string
          minLength: 3
          maxLength: 3
          example: EUR

        stock:
          type: integer
          minimum: 0
          example: 10


    CreateProductRequest:
      type: object
      required:
        - name
        - description
        - price
        - currency
        - stock
      properties:
        name:
          type: string
          example: MacBook Pro

        description:
          type: string
          example: Apple laptop

        price:
          type: integer
          format: int64
          minimum: 0
          example: 150000

        currency:
          type: string
          minLength: 3
          maxLength: 3
          example: EUR

        stock:
          type: integer
          minimum: 0
          example: 10


    UpdateProductRequest:
      type: object
      required:
        - name
        - description
        - price
        - currency
        - stock
      properties:
        name:
          type: string
          example: MacBook Pro

        description:
          type: string
          example: Apple laptop

        price:
          type: integer
          format: int64
          minimum: 0
          example: 150000

        currency:
          type: string
          minLength: 3
          maxLength: 3
          example: EUR

        stock:
          type: integer
          minimum: 0
          example: 10


    # -------------------------
    # Cart
    # -------------------------

    Cart:
      type: object
      required:
        - id
        - user_id
        - status
        - total_amount
        - currency
        - created_at
        - items
      properties:
        id:
          type: integer
          format: int64
          example: 1

        user_id:
          type: integer
          format: int64
          example: 1

        status:
          type: string
          example: draft

        total_amount:
          type: integer
          format: int64
          minimum: 0
          example: 162000

        currency:
          type: string
          example: EUR

        created_at:
          type: string
          format: date-time
          example: "2026-08-23T10:00:00Z"

        items:
          type: array
          items:
            $ref: '#/components/schemas/CartItem'


    CartItem:
      type: object
      required:
        - id
        - product_id
        - quantity
        - unit_price
        - name
        - description
        - currency
        - stock
      properties:
        id:
          type: integer
          format: int64
          example: 1

        product_id:
          type: integer
          format: int64
          example: 1

        quantity:
          type: integer
          minimum: 1
          example: 2

        unit_price:
          type: integer
          format: int64
          minimum: 0
          example: 150000

        name:
          type: string
          example: MacBook Pro

        description:
          type: string
          example: Apple laptop

        currency:
          type: string
          example: EUR

        stock:
          type: integer
          minimum: 0
          example: 10


    AddItemRequest:
      type: object
      required:
        - product_id
        - quantity
      properties:
        product_id:
          type: integer
          format: int64
          minimum: 1
          example: 1

        quantity:
          type: integer
          minimum: 1
          example: 2


    UpdateItemRequest:
      type: object
      required:
        - quantity
      properties:
        quantity:
          type: integer
          minimum: 1
          example: 3


    # -------------------------
    # Orders
    # -------------------------

    Order:
      type: object
      required:
        - id
        - user_id
        - status
        - total_amount
        - currency
        - created_at
      properties:
        id:
          type: integer
          format: int64
          example: 1

        user_id:
          type: integer
          format: int64
          example: 1

        status:
          type: string
          enum:
            - draft
            - pending
            - paid
            - processing
            - shipped
            - completed
            - cancelled
          example: pending

        total_amount:
          type: integer
          format: int64
          minimum: 0
          example: 162000

        currency:
          type: string
          example: EUR

        created_at:
          type: string
          format: date-time
          example: "2026-08-23T10:00:00Z"


    OrderItem:
      type: object
      required:
        - id
        - order_id
        - product_id
        - quantity
        - unit_price
      properties:
        id:
          type: integer
          format: int64
          example: 1

        order_id:
          type: integer
          format: int64
          example: 1

        product_id:
          type: integer
          format: int64
          example: 1

        quantity:
          type: integer
          minimum: 1
          example: 2

        unit_price:
          type: integer
          format: int64
          minimum: 0
          example: 150000


    OrderDetails:
      type: object
      required:
        - order
        - items
      properties:
        order:
          $ref: '#/components/schemas/Order'

        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'


    CreateOrderRequest:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CreateOrderItem'


    CreateOrderItem:
      type: object
      required:
        - product_id
        - quantity
      properties:
        product_id:
          type: integer
          format: int64
          minimum: 1
          example: 1

        quantity:
          type: integer
          minimum: 1
          example: 2


    UpdateOrderStatusRequest:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - draft
            - pending
            - paid
            - processing
            - shipped
            - completed
            - cancelled
          example: processing