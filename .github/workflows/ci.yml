name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16

        env:
          POSTGRES_USER: fincart
          POSTGRES_PASSWORD: fincart
          POSTGRES_DB: fincart

        ports:
          - 5432:5432

        options: >-
          --health-cmd="pg_isready -U fincart -d fincart"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Download dependencies
        run: go mod download

      - name: Run migrations
        env:
          DATABASE_URL: postgresql://fincart:fincart@localhost:5432/fincart?sslmode=disable
        run: go run ./cmd/migrate

      - name: Test
        env:
          DATABASE_URL: postgresql://fincart:fincart@localhost:5432/fincart?sslmode=disable
        run: go test ./...

      - name: Race detector
        env:
          DATABASE_URL: postgresql://fincart:fincart@localhost:5432/fincart?sslmode=disable
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

  openapi-lint:
    name: OpenAPI lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Redocly CLI
        run: npm install -g @redocly/cli

      - name: Lint OpenAPI
        run: redocly lint docs/openapi.yaml -c docs/redocly.yaml


  openapi-contract:
    name: OpenAPI HTTP contract
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Check OpenAPI against HTTP API
        run: go test ./internal/httpserver -run TestOpenAPIContract -v