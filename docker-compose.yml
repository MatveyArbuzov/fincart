services:
  postgres:
    image: postgres:17
    container_name: fincart-postgres
    environment:
      POSTGRES_DB: fincart
      POSTGRES_USER: fincart
      POSTGRES_PASSWORD: fincart
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fincart -d fincart"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: .
      target: migrate
    container_name: fincart-migrate
    environment:
      DATABASE_URL: postgres://fincart:fincart@postgres:5432/fincart?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      target: api
    container_name: fincart-api
    environment:
      DATABASE_URL: postgres://fincart:fincart@postgres:5432/fincart?sslmode=disable
      JWT_SECRET: dev-secret-change-me
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data: